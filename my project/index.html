<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Full-screen opening image">
    <title>Project</title>

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 첫 화면: start1 이미지를 전체 화면으로 표시 -->
    <main class="start-screen">

        <img
            class="start-image"
            src="images/start1.png"
            alt="프로젝트 시작 이미지"
        >

        <!-- 화면을 클릭하면 나타나는 안내 문구 -->
        <p class="click-message" aria-live="polite">
            여러분, 출석은 중요합니다.
        </p>

        <!-- 3초 뒤 같은 자리에 나타나는 두 번째 문구 -->
        <p class="click-message click-message--second" aria-live="polite">
            그러니까 빠지지 마세요!
        </p>

        <!-- 다시 3초 뒤 화면 중앙에 나타나는 세 번째 문구 -->
        <p class="click-message click-message--center" aria-live="polite">
            귀찮은데... 성적 관리할 정도면 되겠지?
        </p>

    </main>

    <!-- 화면 클릭 인터랙션 -->
    <script src="js/script.js"></script>

</body>
</html>
